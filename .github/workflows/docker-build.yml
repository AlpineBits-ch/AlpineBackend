name: Build & Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  DATABASE_HOSTNAME: localhost
  DATABASE_PORT: 5432 
  DATABASE_NAME: identity_test
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: postgres 

jobs:
  test:
    permissions:
      contents: write
      pull-requests: write
    name: Run tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: identity_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          submodules: 'true'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Write Secrets
        env:
          SIX_LABORS_LIC: ${{ secrets.SIX_LABORS_LIC }}
        run: |
          mkdir -p ./Messaging.Application/Credentials
          echo "$SIX_LABORS_LIC" > ./Messaging.Application/Credentials/sixlabors.lic

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      
      - name: Run dotnet test with coverage
        # TestCategory!=E2E: Echo.E2E.Tests boots the real backend via Testcontainers + spawned
        # service processes - correct to build here (catches compile errors), too slow/heavy to
        # run in this fast unit-test job. It has its own job below.
        run: dotnet-coverage collect 'dotnet test --filter "TestCategory!=E2E"' -f cobertura -o 'solution_coverage.xml'
      - name: Run Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: solution_coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          output: both

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Generate Coverage Badge Image
        run: |
          mkdir -p .github/badges
          BADGE_URL=$(grep -oE 'https://img.shields.io/[^)]+' code-coverage-results.md | head -n 1)
          if [ -n "$BADGE_URL" ]; then
            curl -s -o .github/badges/coverage.svg "$BADGE_URL"
          else
            echo "Could not find badge URL in markdown report."
            exit 1
          fi

      - name: Commit Badge Image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/badges/coverage.svg
          git commit -m "Update coverage badge [skip ci]" || exit 0
          git push

  e2e-tests:
    name: Run E2E tests
    runs-on: ubuntu-latest
    # Independent of `test`/`build`: boots the real backend (Testcontainers Postgres/RabbitMQ/
    # Redis + spawned service processes), which is new and slower/heavier than the rest of
    # the suite. Reports its own status rather than gating the Docker build/push, so flakiness
    # here while this harness is new doesn't block deploys.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Write Secrets
        env:
          SIX_LABORS_LIC: ${{ secrets.SIX_LABORS_LIC }}
        run: |
          mkdir -p ./Messaging.Application/Credentials
          echo "$SIX_LABORS_LIC" > ./Messaging.Application/Credentials/sixlabors.lic

      - name: Run Echo.E2E.Tests
        run: dotnet test Echo.E2E.Tests/Echo.E2E.Tests.csproj --logger "console;verbosity=detailed"

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - project: echo
            context: .
            dockerfile: Echo/Dockerfile
            image: echo
          - project: guild
            context: .
            dockerfile: Guild.Application/Dockerfile
            image: guild-application
          - project: messaging
            context: .
            dockerfile: Messaging.Application/Dockerfile
            image: messaging-application
          - project: identity
            context: .
            dockerfile: Identity.Application/Dockerfile
            image: identity-application
          - project: social
            context: .
            dockerfile: Social.Application/Dockerfile
            image: social-application
          - project: federation
            context: .
            dockerfile: Federation.Application/Dockerfile
            image: federation-application
          - project: Isle
            context: .
            dockerfile: Isle.Application/Dockerfile
            image: isle-application
          - project: Bot
            context: .
            dockerfile: Bots.Application/Dockerfile
            image: bots-application
          - project: import
            context: .
            dockerfile: Import.Application/Dockerfile
            image: import-application
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          submodules: 'true'

      - name: Write Secrets
        env:
          SIX_LABORS_LIC: ${{ secrets.SIX_LABORS_LIC }}
        run: |
          mkdir -p ./Messaging.Application/Credentials
          echo "$SIX_LABORS_LIC" > ./Messaging.Application/Credentials/sixlabors.lic

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        env:
          IDENTITY_KEY_PASSWORD: ${{ secrets.IDENTITY_KEY_PASSWORD }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IDENTITY_KEY_PASSWORD=${{ secrets.IDENTITY_KEY_PASSWORD }}