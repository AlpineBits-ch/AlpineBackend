# =====================================================================================
# Venta / Echo self-hosted stack - production compose file.
#
# Generated-config contract: every value below comes from deploy/.env, which is written
# by deploy/install.sh (Linux) or deploy/Install-VentaStack.ps1 (Windows). Do not edit
# secrets here - edit .env and re-run `ventactl up`.
#
# Always invoke through the wrapper so the project name / env file / project directory
# are consistent:
#
#   docker compose -p venta --project-directory <deploy> -f <deploy>/compose.yaml \
#                  --env-file <deploy>/.env <command>
#
# Profiles
#   pg-local       built-in PostgreSQL (omit when pointing at an external database)
#   storage-local  built-in MinIO S3 (omit when pointing at external S3/GCS)
#   scylla         ScyllaDB message store (Messaging falls back to Postgres without it)
#   caddy          bundled TLS-terminating reverse proxy
#   isle           The Isle game-server integration service
#   hosted         the Billing service - only for the hosted product, never for a self-hoster
# =====================================================================================

name: venta

# ── Shared application environment ───────────────────────────────────────────────────
# Mirrors AppEnvironment/Env.cs one-for-one. Anything a service reads at runtime is
# either here or in that service's own `environment:` block below.
x-app-env: &app-env
  # --- Postgres (per-service database, DATABASE_NAME is set per service) -------------
  DATABASE_HOSTNAME: "${DATABASE_HOSTNAME}"
  DATABASE_PORT: "${DATABASE_PORT}"
  DATABASE_USERNAME: "${DATABASE_USERNAME}"
  DATABASE_PASSWORD: "${DATABASE_PASSWORD}"

  # --- Redis (distributed cache, SignalR backplane, DataProtection ring) -------------
  REDIS_HOST: "${REDIS_HOST}"
  REDIS_PORT: "${REDIS_PORT}"
  REDIS_USERNAME: "${REDIS_USERNAME:-}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # --- RabbitMQ (Wolverine transport - every service must share one broker) ---------
  RABBITMQ_HOST: "${RABBITMQ_HOST}"
  RABBITMQ_PORT: "${RABBITMQ_PORT}"
  RABBITMQ_USERNAME: "${RABBITMQ_USERNAME}"
  RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"

  # --- Host / identity ---------------------------------------------------------------
  # INSTANCE_URL is load-bearing in three separate ways:
  #   1. OpenIddict issuer minted into every access token (Identity)
  #   2. JwtBearer Authority every other service uses to fetch
  #      {INSTANCE_URL}/.well-known/openid-configuration + /.well-known/jwks
  #   3. the federation `host` field remote instances sign against and call back into
  # It must therefore be the *public* URL and be resolvable from inside the containers -
  # see the caddy service's network alias / HAIRPIN_HOST_ENTRY below.
  INSTANCE_URL: "${INSTANCE_URL}"
  INSTANCE_NAME: "${INSTANCE_NAME}"
  VERSION: "${INSTANCE_VERSION:-1.0.0}"
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"

  # --- Extra hostnames that mean "this instance" in a posted link ---------------------
  # Additive to the two that are derived: INSTANCE_URL's host, and the web client's
  # (`app.<host>`, or APP_DOMAIN). See AppEnvironment/InstanceLinkHosts.cs.
  #
  # Two features read it and would be wrong in opposite directions if they disagreed, which
  # is why it is IN THE SHARED BLOCK rather than on the two services that use it. Messaging
  # turns a link to one of these hosts into an invite card resolved in-process; Unfurl
  # refuses to fetch one at all, because a fetcher that exists to dial strangers must never
  # be aimed at our own API. Split across two variables, one of them missing an alias means
  # invite links come back as a scraped card for whatever your marketing page says.
  #
  # Set it when invite links people paste do not carry the same hostname as the web client:
  # a vanity or apex domain that redirects into the app, a hostname you migrated from, or a
  # CDN name in front of it. Comma, space or semicolon separated; bare hosts or full URLs.
  #   INSTANCE_LINK_HOSTS=example.com,www.example.com
  #
  # Trade-off: a link to any other page on a host listed here gets no card at all rather
  # than a scraped one. An unrecognised path on our own host is still our own host.
  INSTANCE_LINK_HOSTS: "${INSTANCE_LINK_HOSTS:-}"

  # --- Browser origins allowed to read authenticated API responses --------------------
  # Additive: it never removes the built-ins (the desktop shells, `http://localhost:4200`,
  # `http://localhost:1420`) or the web client derived from INSTANCE_URL, so you cannot lock
  # your own apps out with it. See AppEnvironment/ClientOrigins.cs. Comma, semicolon or
  # whitespace separated; `*` is refused, and anything unparseable is dropped with a line in
  # the startup log rather than silently.
  #
  # IN THE SHARED BLOCK because the gateway is not the only service with a CORS policy -
  # Federation has its own, and the two lists had already drifted once.
  #
  # This is the setting a first-party site of your own needs and does not obviously ask for:
  # only the two localhost dev origins are built in, so a browser app you serve from your own
  # hostname works perfectly in development and then fails in production with a CORS error and
  # NOTHING IN ANY SERVER LOG. The hosted instance carries the Isle companion site this way:
  #   CORS_ALLOWED_ORIGINS=https://isle.venta.gg
  # Signing in is a separate grant, in AUTH_CLIENTS on the identity service below. A site
  # generally needs both, and each fails in its own way.
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"

  # --- Auth ---------------------------------------------------------------------------
  # The OIDC issuer: the name Identity stamps into every `iss` claim and every other service
  # checks it against. It is IN THE SHARED BLOCK for that reason - one service left on a
  # different value rejects every token the others accept, and the symptom is a 401 that
  # reads exactly like a signing-key problem. If you change it, all nine change together.
  #
  # Nothing fetches this. Services still discover keys through INSTANCE_URL (see
  # Echo.Auth/VentaJwtAuthentication.cs), which is the address already proven to answer from
  # inside the container network, so auth.<host> does not have to exist in DNS for the stack
  # to work - it only has to exist for the sign-in site to be reachable.
  #
  # Empty means "auth.<INSTANCE_URL host>", which is what the installers configure Caddy and
  # AUTH_DOMAIN for. Set it only to move the issuer somewhere else entirely, and expect every
  # existing token to stop validating at the moment you do.
  AUTH_ISSUER_URL: "${AUTH_ISSUER_URL:-}"
  AUTH_REQUIRE_USER_EMAIL_VERIFICATION: "${AUTH_REQUIRE_USER_EMAIL_VERIFICATION:-false}"
  IDENTITY_KEY_PASSWORD: "${IDENTITY_KEY_PASSWORD}"
  IDENTITY_SIGNING_CERT: "${IDENTITY_SIGNING_CERT:-}"
  IS_USER_HASH_GENERATION_ENABLED: "${IS_USER_HASH_GENERATION_ENABLED:-true}"

  # --- Federation (Ed25519 keypair, PEM/PKIX text, base64-encoded) --------------------
  FEDERATION_PRIVATE_KEY_BASE_64: "${FEDERATION_PRIVATE_KEY_BASE_64}"
  FEDERATION_PUBLIC_KEY_BASE_64: "${FEDERATION_PUBLIC_KEY_BASE_64}"

  # --- Object storage (S3-compatible; PUBLIC_URL is what clients see) -----------------
  BUCKET_NAME: "${BUCKET_NAME:-echo-chat}"
  ACCESS_KEY_ID: "${ACCESS_KEY_ID}"
  SECRET_ACCESS_KEY: "${SECRET_ACCESS_KEY}"
  PUBLIC_URL: "${STORAGE_PUBLIC_URL}"
  SERVICE_URL: "${STORAGE_SERVICE_URL:-http://minio:9000}"
  USE_SERVICE_URL: "${STORAGE_USE_SERVICE_URL:-true}"
  REGION: "${STORAGE_REGION:-us-east-1}"

  # --- Transactional email (Microsoft Graph; only used when verification is on) -------
  MICROSOFT_GRAPH_CLIENT_ID: "${MICROSOFT_GRAPH_CLIENT_ID:-}"
  MICROSOFT_GRAPH_CLIENT_SECRET: "${MICROSOFT_GRAPH_CLIENT_SECRET:-}"

  # --- License mode and operator ceilings ---------------------------------------------
  # LICENSE_MODE=selfhost is the default and means every entitlement resolves to its maximum:
  # no plan limits, no billing surface, nothing to configure and nothing to pay. There is no
  # license check anywhere in this stack - no key, no expiry, nothing phones home - so this is a
  # statement about what this deployment is, not a credential. Leave it alone.
  #
  # The three ceilings below are a different question and are the ones a self-hoster may actually
  # want: they cap what THIS SERVER will do regardless of what anyone is entitled to, because a
  # voice room's bandwidth is billed to whoever runs the SFU. Empty means no cap, which is how the
  # stack ships, except for the video ceiling - see below. VOICE_VIDEO_CEILING takes a quality name
  # (none, 480p30, 720p30, 1080p30, 1080p60, 1440p60, 2160p60); the other two take a plain number,
  # bytes for the upload one. VOICE_MAX_PARTICIPANTS=12 with VOICE_VIDEO_CEILING=720p30 is a
  # sensible pair for a small server on a metered connection.
  #
  # VOICE_VIDEO_CEILING ships at 2160p60, the top of the ladder, so that a guild on Pro actually
  # receives the 4K its plan grants. It is pinned to a rung rather than left empty because the
  # entitlement catalogue's default for a paired ladder key has to be its TOP rung - a member with
  # no user-side source would otherwise clamp every guild that paid for more - so "unconfigured"
  # already means "whatever the ladder's top is today". A rung added above 2160p60 later should be
  # a deliberate edit here, not an automatic raise.
  #
  # THE COST, STATED PLAINLY. 4K is only cheap once the SFU hands small tiles a lower simulcast
  # layer, and that needs two things of which only one is done: the server sends preferredRid on the
  # subscribe (wired), and publishers send simulcast encodings (NOT wired - the desktop publisher
  # sends a single encoding). Until the second lands, every viewer pulls the top layer and one 4K
  # share to fourteen people costs 50 GB/hour against the 18 the pricing model assumes. Set this
  # back to 1080p60 if that is not a bill you want to carry - a self-hoster on a metered connection
  # almost certainly should. See docs/specs/monetization-pricing-model.md section 1.
  LICENSE_MODE: "${LICENSE_MODE:-selfhost}"
  # Where the billing service answers. Empty is the shipped state and is correct in selfhost, where
  # the service is not deployed at all (it sits behind the `hosted` profile below). A hosted instance
  # sets this to http://billing:8080 and LICENSE_MODE=hosted together - the gateway refuses to start
  # on `hosted` with neither this nor a Stripe key, because it would otherwise resolve every
  # entitlement to unlimited and look perfectly healthy giving the product away.
  BILLING_SERVICE_URL: "${BILLING_SERVICE_URL:-}"
  VOICE_MAX_PARTICIPANTS: "${VOICE_MAX_PARTICIPANTS:-}"
  VOICE_VIDEO_CEILING: "${VOICE_VIDEO_CEILING:-2160p60}"
  STORAGE_UPLOAD_MAX_BYTES: "${STORAGE_UPLOAD_MAX_BYTES:-}"

  # --- Optional third-party integrations ----------------------------------------------
  # Voice/video SFU. Unset means the instance runs with no voice at all, which is a supported
  # state - the voice endpoints answer 503 with a reason rather than failing obscurely.
  #
  # LIVEKIT_API_SECRET is a root credential: it mints admin tokens for every room, the SFU verifies
  # signatures offline, and there is no revocation short of rotating the key on the node.
  LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
  LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
  # One entry per node, contiguous from zero. SIGNALINGURL is public and is handed to browsers;
  # APIURL is the control plane and must stay unroutable from outside the deployment.
  LIVEKIT__NODES__0__REGION: "${LIVEKIT__NODES__0__REGION:-}"
  LIVEKIT__NODES__0__SIGNALINGURL: "${LIVEKIT__NODES__0__SIGNALINGURL:-}"
  LIVEKIT__NODES__0__APIURL: "${LIVEKIT__NODES__0__APIURL:-}"
  SENTRY_URL: "${SENTRY_URL:-}"
  ACCOUNT_DELETION_GRACE_PERIOD_SECONDS: "${ACCOUNT_DELETION_GRACE_PERIOD_SECONDS:-2592000}"
  ACCOUNT_DELETION_SWEEP_INTERVAL_SECONDS: "${ACCOUNT_DELETION_SWEEP_INTERVAL_SECONDS:-300}"

# Lets containers resolve INSTANCE_URL's hostname when TLS is terminated by a proxy that
# is NOT part of this compose project. Defaults to an inert entry so the key is always
# valid YAML with exactly one element.
x-hairpin: &hairpin
  - "${HAIRPIN_HOST_ENTRY:-venta-hairpin.invalid:127.0.0.1}"

# The .NET runtime images ship no curl/wget (removed upstream in .NET 8), so the classic
# `curl -f .../health` healthcheck can never pass in them. This probe falls back to a raw
# bash /dev/tcp request when neither tool exists.
x-probe-mount: &probe-mount
  - ./healthcheck.sh:/opt/venta/healthcheck.sh:ro

x-app-common: &app-common
  restart: unless-stopped
  extra_hosts: *hairpin
  volumes: *probe-mount
  depends_on:
    postgres-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    profiles: ["pg-local"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: "${DATABASE_USERNAME}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the nine per-service databases idempotently, and waits for the server to
  # accept connections first. Deliberately NOT the postgres image's
  # /docker-entrypoint-initdb.d hook: that only fires on a first-ever init of an empty
  # data directory, so it silently skips both external databases and every upgrade that
  # adds a new service (bots/import/isle were exactly that case).
  postgres-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: "${DATABASE_PASSWORD}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Waiting for PostgreSQL at ${DATABASE_HOSTNAME}:${DATABASE_PORT} ..."
        for i in $$(seq 1 120); do
          if pg_isready -h "${DATABASE_HOSTNAME}" -p "${DATABASE_PORT}" -U "${DATABASE_USERNAME}" >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        pg_isready -h "${DATABASE_HOSTNAME}" -p "${DATABASE_PORT}" -U "${DATABASE_USERNAME}"
        for db in identity_db guild_db messaging_db social_db federation_db bots_db import_db isle_db echo_db unfurl_db billing_db; do
          psql -v ON_ERROR_STOP=1 -h "${DATABASE_HOSTNAME}" -p "${DATABASE_PORT}" \
               -U "${DATABASE_USERNAME}" -d postgres <<SQL
        SELECT 'CREATE DATABASE $$db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$db')\gexec
        SQL
        done
        echo "Databases ready."
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      # Management UI, bound to loopback by default - never expose this publicly.
      - "${RABBITMQ_MGMT_BIND:-127.0.0.1:15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  scylladb:
    image: scylladb/scylla:6.2
    profiles: ["scylla"]
    command: >-
      --authenticator=PasswordAuthenticator
      --authorizer=CassandraAuthorizer
      --smp=${SCYLLA_SMP:-1}
      --overprovisioned=1
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # Scylla's PasswordAuthenticator always starts with the built-in cassandra/cassandra
  # superuser. Handing the app a generated SCYLLA_PASSWORD without ever applying it to the
  # cluster (as the old compose file did) means Messaging can never authenticate, so roll
  # the password here. Idempotent: a rerun finds the default login already gone and exits.
  scylla-init:
    image: scylladb/scylla:6.2
    profiles: ["scylla"]
    depends_on:
      scylladb:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -u
        if cqlsh scylladb 9042 -u cassandra -p "${SCYLLA_PASSWORD:-cassandra}" -e "DESCRIBE KEYSPACES" >/dev/null 2>&1; then
          echo "Scylla credentials already provisioned."
          exit 0
        fi
        for i in $$(seq 1 30); do
          if cqlsh scylladb 9042 -u cassandra -p cassandra \
               -e "ALTER ROLE cassandra WITH PASSWORD = '${SCYLLA_PASSWORD:-cassandra}';" >/dev/null 2>&1; then
            echo "Scylla superuser password rotated."
            exit 0
          fi
          sleep 5
        done
        echo "ERROR: could not provision Scylla credentials." >&2
        exit 1
    restart: "no"

  minio:
    image: minio/minio:latest
    profiles: ["storage-local"]
    environment:
      MINIO_ROOT_USER: "${ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${SECRET_ACCESS_KEY}"
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_BIND:-127.0.0.1:9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1:9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    profiles: ["storage-local"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set localminio http://minio:9000 "${ACCESS_KEY_ID}" "${SECRET_ACCESS_KEY}"
        mc mb --ignore-existing "localminio/${BUCKET_NAME:-echo-chat}"
        mc anonymous set download "localminio/${BUCKET_NAME:-echo-chat}"
        echo "Bucket ready."
    restart: "no"

  # ── Application services ───────────────────────────────────────────────────────────
  # Each one applies its own EF Core migrations at startup (Database.Migrate() in its
  # *.Infrastructure module), so no separate migration step exists or is needed.

  identity:
    <<: *app-common
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/identity-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Identity.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: identity_db
      # The OIDC client allowlist, as a JSON array - the only way a site is allowed to start an
      # authorization-code flow against this instance. Reconciled into OpenIddict's tables at
      # every startup, so adding a site is an edit here plus `ventactl restart identity`, and
      # removing one DISABLES the row rather than deleting it (existing tokens keep validating
      # until they expire - revoke them if that matters).
      #
      # Empty by default and that is the right default: a fresh instance with no partner sites
      # should have no client able to ask it for a token. The sign-in site itself does not need
      # an entry - Identity bootstraps its own `echo` client.
      #
      # Shape and a worked example: docs/specs/sso-integration.md. Single line, single quotes:
      #   AUTH_CLIENTS='[{"clientId":"wiki","displayName":"Venta Wiki",
      #                   "redirectUris":["https://wiki.example.com/callback"],
      #                   "scopes":["openid","profile","email"],"firstParty":true,"public":true}]'
      #
      # A CONFIDENTIAL client ("public": false) also needs its secret, under a name derived from
      # the client id - uppercased, every non-alphanumeric character replaced with an underscore,
      # prefixed AUTH_CLIENT_SECRET_ (Env.AuthConfiguration.ClientSecretVariable). Compose cannot
      # forward a name it does not know, so add the line yourself next to this one, e.g.
      #   AUTH_CLIENT_SECRET_WIKI: "${AUTH_CLIENT_SECRET_WIKI:-}"
      # Browser and mobile clients should be public + PKCE instead; PKCE is required either way.
      #
      # An entry here buys a site sign-in and nothing else. If it also calls the API from the
      # browser, its origin has to be in CORS_ALLOWED_ORIGINS (shared block, top of this file)
      # as well; the two are enforced by different services and neither implies the other.
      AUTH_CLIENTS: "${AUTH_CLIENTS:-}"
      STEAM_PUBLIC_BASE_URL: "${STEAM_PUBLIC_BASE_URL:-${INSTANCE_URL}}"
      STEAM_PUBLIC_CALLBACK_PATH: "${STEAM_PUBLIC_CALLBACK_PATH:-/api/v1/identity/authentication/steam/callback}"
      STEAM_CLIENT_RETURN_URL: "${STEAM_CLIENT_RETURN_URL:-venta://steam-auth}"
      STEAM_WEB_API_KEY: "${STEAM_WEB_API_KEY:-}"
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/identity/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  guild:
    <<: *app-common
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/guild-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Guild.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: guild_db
      FIREBASE_SEVRICE_ACCOUNT_JSON_BASE_64: "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE_64:-}"
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE_64: "${GOOGLE_SERVICE_ACCOUNT_JSON_BASE_64:-}"
      # The pantry scanner's product lookup, which works with none of this set. Open Food Facts ask
      # callers to identify themselves as AppName/Version (ContactEmail); unset, that is this
      # project's address. **Put your own here.** The lookups are your users' and your traffic, and
      # this is who Open Food Facts would write to about them. Setting it to an empty string turns
      # the lookup off, which is a decision rather than a default.
      PRODUCT_CATALOG_CONTACT_EMAIL: "${PRODUCT_CATALOG_CONTACT_EMAIL:-hello@alpinebits.ch}"
      # false stops every outbound product lookup, inline and on the sweep. For an operator who does
      # not want their server asking a third party what their flatmates bought.
      PRODUCT_CATALOG_LIVE_FILL_ENABLED: "${PRODUCT_CATALOG_LIVE_FILL_ENABLED:-true}"
      # Open Food Facts allow 15 product reads per minute per IP address, for this whole deployment
      # rather than per household. These two are the sustained rate and the burst, and a token
      # bucket's worst case in any sliding minute is their sum - so raising either past 15 between
      # them is asking to be throttled, not asking for more coverage.
      PRODUCT_CATALOG_REQUESTS_PER_MINUTE: "${PRODUCT_CATALOG_REQUESTS_PER_MINUTE:-10}"
      PRODUCT_CATALOG_BURST_CAPACITY: "${PRODUCT_CATALOG_BURST_CAPACITY:-4}"
      # What one scan will wait for an answer before giving up and asking the user for a name.
      # Measured round trip is 44-66 ms; this is the ceiling that keeps a bad day at the source from
      # becoming a slow scanner.
      PRODUCT_CATALOG_INLINE_TIMEOUT_MS: "${PRODUCT_CATALOG_INLINE_TIMEOUT_MS:-1000}"
      # Point at https://world.openfoodfacts.net (basic auth off / off) to test against their
      # staging environment, which is what they ask applications to do.
      PRODUCT_CATALOG_API_BASE_URL: "${PRODUCT_CATALOG_API_BASE_URL:-https://world.openfoodfacts.org/}"
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/guild/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  messaging:
    <<: *app-common
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/messaging-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Messaging.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: messaging_db
      # With USE_SCYLLA_DB=false the message store is plain Postgres and the scylla
      # profile can stay off entirely.
      USE_SCYLLA_DB: "${USE_SCYLLA_DB:-true}"
      SCYLLA_HOST: "${SCYLLA_HOST:-scylladb}"
      SCYLLA_PORT: "${SCYLLA_PORT:-9042}"
      SCYLLA_USERNAME: "${SCYLLA_USERNAME:-cassandra}"
      SCYLLA_PASSWORD: "${SCYLLA_PASSWORD:-cassandra}"
      # Push notifications: FCM for regular pushes, direct APNs for VoIP/CallKit.
      FIREBASE_SEVRICE_ACCOUNT_JSON_BASE_64: "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE_64:-}"
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE_64: "${GOOGLE_SERVICE_ACCOUNT_JSON_BASE_64:-}"
      APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-gg.venta.mobile}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_AUTH_KEY_BASE_64: "${APNS_AUTH_KEY_BASE_64:-}"
      APNS_USE_SANDBOX: "${APNS_USE_SANDBOX:-true}"
    # Intentionally no depends_on for scylladb: it lives in an optional profile, and a
    # cross-profile dependency would make every no-Scylla deployment fail to start.
    # Messaging crash-loops until Scylla answers, which `restart: unless-stopped` covers.
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/messaging/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  social:
    <<: *app-common
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/social-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Social.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: social_db
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/social/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  federation:
    <<: *app-common
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/federation-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Federation.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: federation_db
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/federation/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  bots:
    <<: *app-common
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/bots-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Bots.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: bots_db
      Services__Identity: http://identity:8080
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/bots/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  import:
    <<: *app-common
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/import-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Import.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: import_db
      # Without a bot token the Discord gateway client no-ops and the service idles.
      DISCORD_IMPORT_BOT_TOKEN: "${DISCORD_IMPORT_BOT_TOKEN:-}"
      DISCORD_IMPORT_CLIENT_ID: "${DISCORD_IMPORT_CLIENT_ID:-}"
      DISCORD_IMPORT_PUBLIC_BASE_URL: "${DISCORD_IMPORT_PUBLIC_BASE_URL:-${INSTANCE_URL}}"
      DISCORD_IMPORT_PUBLIC_CALLBACK_PATH: "${DISCORD_IMPORT_PUBLIC_CALLBACK_PATH:-/api/v1/imports/discord/callback}"
      DISCORD_IMPORT_CLIENT_RETURN_URL: "${DISCORD_IMPORT_CLIENT_RETURN_URL:-venta://discord-import}"
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/import/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  isle:
    <<: *app-common
    profiles: ["isle"]
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/isle-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Isle.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: isle_db
      ISLE_IP_ADDRESS: "${ISLE_IP_ADDRESS:-10.0.0.0}"
      ISLE_BRIDGE_PORT: "${ISLE_BRIDGE_PORT:-8080}"
      ISLE_RCON_PORT: "${ISLE_RCON_PORT:-8888}"
      RCON_PASSWORD: "${ISLE_RCON_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/isle/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # Link previews. The only service that makes outbound HTTP
  # requests to hosts chosen by end users, which is exactly why it is its own container: its egress
  # can be firewalled independently, and a hostile page cannot reach the message store or the MLS
  # key material from here. It owns no data - unfurl_db holds Wolverine's envelopes and nothing
  # else - so it is safe to scale or restart freely.
  #
  # Set UNFURL_ENABLED=false to turn the feature off entirely: no outbound fetches, no previews.
  unfurl:
    <<: *app-common
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/unfurl-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Unfurl.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: unfurl_db
      UNFURL_ENABLED: "${UNFURL_ENABLED:-true}"
      # Never "true" on a public instance: it disables the SSRF guard, letting any user's link
      # reach 127.0.0.1, 169.254.169.254 and everything else on the compose network.
      UNFURL_ALLOW_PRIVATE_TARGETS: "${UNFURL_ALLOW_PRIVATE_TARGETS:-false}"
      # proxy_url values are built from this and stored in messages permanently, so it must be the
      # instance's public URL and it must not change casually.
      UNFURL_PUBLIC_BASE_URL: "${UNFURL_PUBLIC_BASE_URL:-${INSTANCE_URL:-}}"
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/unfurl/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # Subscriptions, grants, promotions and the Stripe integration (docs/specs/monetization.md).
  #
  # **Not deployed by a self-hosted stack, and that is the whole design.** In LICENSE_MODE=selfhost -
  # the default, and what every installer writes - every entitlement already resolves to its maximum
  # and every billing surface is hidden, so this service would have nothing to answer and no caller.
  # It sits behind the `hosted` profile for that reason, nothing else depends on it, and the gateway
  # does not even register a route to it unless the instance says it is hosted. A self-hosted stack
  # is fully healthy without this container ever having existed.
  #
  # Bringing it up is three things together: `--profile hosted`, LICENSE_MODE=hosted, and
  # BILLING_SERVICE_URL=http://billing:8080. Any one of them alone is a misconfiguration, and each of
  # the three refuses rather than degrading quietly.
  billing:
    <<: *app-common
    profiles: ["hosted"]
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/billing-application:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Billing.Application/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: billing_db
      # The only component that ever holds a Stripe key, per monetization.md section 4.3.
      # Deliberately NOT in the shared block above, for the same reason GATEWAY_PROXY_SECRET is not:
      # a value in x-app-env is handed to all nine other services, which is exactly what "only this
      # component" is supposed to prevent.
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/billing/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── Gateway ────────────────────────────────────────────────────────────────────────
  # YARP reverse proxy + the SignalR realtime hub + the cross-service sagas
  # (Echo/Sagas/*). Not optional: user registration completes through a saga hosted here.
  echo:
    <<: *app-common
    image: "${IMAGE_PREFIX:-ghcr.io/alpinebits-ch}/echo:${IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Echo/Dockerfile
    environment:
      <<: *app-env
      DATABASE_NAME: echo_db
      Services__Identity: http://identity:8080
      Services__Guild: http://guild:8080
      Services__Messaging: http://messaging:8080
      Services__Social: http://social:8080
      Services__Federation: http://federation:8080
      Services__Bots: http://bots:8080
      Services__Import: http://import:8080
      Services__Isle: http://isle:8080
      Services__Unfurl: http://unfurl:8080
      PERSONAL_ACCESS_TOKEN: "${PERSONAL_ACCESS_TOKEN:-}"
      # The API reference is served by this container and is gated on the Host header, so the
      # gateway and the Caddyfile must agree on the name. Left empty the gateway derives
      # docs.<instance host> itself, which is what the installers configure Caddy for.
      DOCS_DOMAIN: "${DOCS_DOMAIN:-}"
      # The moderation console and the public support site, same mechanism as the docs above:
      # served by this container, gated on the Host header, and derived as admin.<instance host>
      # and support.<instance host> when left empty. Whatever is set here has to match the
      # Caddyfile, or the gateway serves nothing on that name and says so in its log.
      ADMIN_DOMAIN: "${ADMIN_DOMAIN:-}"
      SUPPORT_DOMAIN: "${SUPPORT_DOMAIN:-}"
      # The public status page, same mechanism again. Its detector needs no configuration to work -
      # the thresholds below are only for tuning an instance whose traffic is noisier or quieter
      # than the defaults assume. STATUS_AUTO_DETECTION=0 leaves the page and the console fully
      # working and stops anything being published without a person doing it.
      # The sign-in site, same mechanism again - but this one is not just a page. The OIDC
      # endpoints answer on this hostname too (/connect/**, /.well-known/openid-configuration,
      # /.well-known/jwks are proxied through to Identity), so this name and AUTH_ISSUER_URL
      # describe the same host and must agree. Left empty both derive auth.<instance host>,
      # which is what the installers configure Caddy for.
      #
      # This is also the one site hostname that needs a DNS record before it does anything:
      # a partner site sends a person's browser to it by name.
      AUTH_DOMAIN: "${AUTH_DOMAIN:-}"
      STATUS_DOMAIN: "${STATUS_DOMAIN:-}"
      # The public wiki, same mechanism again, derived as wiki.<instance host> when left empty. This
      # is the one hostname that serves prose somebody else wrote, so it renders server-side with no
      # script at all and answers on nothing but the wiki. A guild has to opt in per wiki and per
      # page before anything appears here, so the name resolving is not the same as it publishing.
      #
      # This is the apex only. Each published wiki answers on <slug>.<this name>, so the DNS record
      # and the proxy's certificate both need to cover *.<this name> as well; the apex keeps serving
      # the /<slug>/<page> form and redirects it, which is what still works while they do not.
      WIKI_DOMAIN: "${WIKI_DOMAIN:-}"
      STATUS_AUTO_DETECTION: "${STATUS_AUTO_DETECTION:-}"
      STATUS_DEGRADED_RATE: "${STATUS_DEGRADED_RATE:-}"
      STATUS_OUTAGE_RATE: "${STATUS_OUTAGE_RATE:-}"
      STATUS_MINIMUM_VOLUME: "${STATUS_MINIMUM_VOLUME:-}"
      # Reverse-proxy trust. Deliberately NOT in x-app-env: the whole point of the secret is
      # that only the gateway knows it, and putting it in the shared block would hand it to all
      # eight backend services - the exact outcome the gateway strips the header to prevent.
      #
      # The reverse proxy sends this value as the X-Echo-Proxy-Auth header alongside
      # X-Forwarded-For; a match is what makes the forwarded chain believable, and therefore
      # what gives each caller their own rate-limit bucket instead of one bucket for the whole
      # internet. Both default to empty so a .env written before this existed still starts: the
      # gateway then ignores forwarded headers, partitions on the peer address, and says so in a
      # startup warning.
      GATEWAY_PROXY_SECRET: "${GATEWAY_PROXY_SECRET:-}"
      # Alternative mechanism, honoured in addition to the secret: addresses/CIDRs whose
      # forwarded headers are believed. Only useful where proxy addresses are stable.
      GATEWAY_TRUSTED_PROXIES: "${GATEWAY_TRUSTED_PROXIES:-}"
    ports:
      - "${GATEWAY_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
      guild:
        condition: service_started
      messaging:
        condition: service_started
      social:
        condition: service_started
      federation:
        condition: service_started
      bots:
        condition: service_started
      import:
        condition: service_started
      unfurl:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "/opt/venta/healthcheck.sh", "/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── TLS termination ────────────────────────────────────────────────────────────────
  # Caddy fetches and renews Let's Encrypt certificates on its own (HTTP-01 on :80), so
  # nothing else has to run certbot. The network alias makes the public hostname resolve
  # to this container from inside the compose network: services fetch
  # {INSTANCE_URL}/.well-known/openid-configuration over real TLS without depending on
  # the host's router doing NAT hairpinning.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    depends_on:
      echo:
        condition: service_started
    ports:
      - "${HTTP_BIND:-0.0.0.0:80}:80"
      - "${HTTPS_BIND:-0.0.0.0:443}:443"
      - "${HTTPS_BIND:-0.0.0.0:443}:443/udp"
    volumes:
      - ./generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases:
          - "${INSTANCE_DOMAIN:-venta-app.invalid}"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  scylla_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: venta_net
