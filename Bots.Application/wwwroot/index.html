<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>venta.gg — Bot Developer Portal</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #dcdfe4;
    --text: #1b1f24;
    --muted: #5b6472;
    --accent: #4f5bd5;
    --accent-text: #ffffff;
    --danger: #c4342f;
    --ok: #1a7f37;
    --mono-bg: #f0f1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1d2026;
      --border: #30343c;
      --text: #e7e9ec;
      --muted: #9aa2ad;
      --accent: #7b86f0;
      --accent-text: #10121a;
      --danger: #ff6b64;
      --ok: #4ada85;
      --mono-bg: #12141a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 28px; font-size: 13px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=password], input[type=number], textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }
  button + button { margin-left: 8px; }
  .actions { margin-top: 14px; }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--mono-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    word-break: break-all;
    font-size: 12.5px;
  }
  .credential { margin-top: 10px; }
  .credential .mono { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .credential .mono button { flex-shrink: 0; padding: 3px 9px; font-size: 12px; }
  .warning {
    color: var(--danger);
    font-size: 12.5px;
    margin: 10px 0 0;
  }
  .status { font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .bot-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .bot-item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .bot-item .name { font-weight: 600; }
  .bot-item .id { color: var(--muted); font-size: 12px; }
  .badge {
    font-size: 11px;
    border-radius: 999px;
    padding: 2px 8px;
    border: 1px solid var(--border);
  }
  .badge.enabled { color: var(--ok); border-color: var(--ok); }
  .badge.disabled { color: var(--danger); border-color: var(--danger); }
  .empty { color: var(--muted); font-size: 13px; }
  .permission-picker {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 6px;
  }
  .permission-group h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .permission-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text);
    margin: 4px 0;
    font-weight: normal;
  }
  .permission-group input[type=checkbox] { margin: 0; width: auto; }
  .computed-value { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .subheading {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  .subheading:first-child { margin-top: 0; }
  .install-panel { margin-top: 12px; }
  .install-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .install-row:last-child { border-bottom: none; }
  .install-row .guild-id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .install-row .perms { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Bot Developer Portal</h1>
  <p class="subtitle">Create and manage bot applications for venta.gg. Bot tokens work with the Discord-compat REST surface at <code>/api/discord/v10</code>.</p>

  <section class="card" id="login-card">
    <h2>Log in</h2>
    <div id="login-form">
      <label for="login-username">Email or username</label>
      <input type="text" id="login-username" autocomplete="username" />
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" />
      <div class="actions">
        <button class="primary" id="login-submit">Log in</button>
      </div>
    </div>
    <div id="logged-in-state" style="display:none;">
      <p style="margin:0;">Logged in as <strong id="logged-in-as"></strong>.</p>
      <div class="actions">
        <button id="logout">Log out</button>
      </div>
    </div>
    <p class="status" id="token-status"></p>

    <details style="margin-top:16px;">
      <summary style="cursor:pointer; color:var(--muted); font-size:12.5px;">Advanced: use an access token directly</summary>
      <div style="margin-top:10px;">
        <label for="access-token">Bearer access token</label>
        <input type="password" id="access-token" placeholder="Paste an existing access token" autocomplete="off" />
        <div class="actions">
          <button id="save-token">Save token</button>
        </div>
      </div>
    </details>
  </section>

  <section class="card">
    <h2>Create a bot</h2>
    <label for="bot-name">Name</label>
    <input type="text" id="bot-name" placeholder="Captain Hook" />
    <label for="bot-description">Description (optional)</label>
    <textarea id="bot-description" placeholder="What does this bot do?"></textarea>
    <label for="bot-icon">Icon URL (optional)</label>
    <input type="text" id="bot-icon" placeholder="https://..." />

    <label style="margin-top:14px;">Default permissions</label>
    <div class="permission-picker" id="permission-picker"></div>
    <p class="computed-value" id="permissions-computed"></p>

    <div class="actions">
      <button class="primary" id="create-bot">Create bot</button>
    </div>
    <p class="status" id="create-status"></p>
    <div id="new-credentials"></div>
  </section>

  <section class="card">
    <div class="row" style="align-items:center;">
      <h2 style="margin:0;">Your bots</h2>
      <div style="flex:0; margin-left:auto;"><button id="refresh-bots">Refresh</button></div>
    </div>
    <p class="status" id="list-status"></p>
    <div id="bot-list"></div>
  </section>
</main>

<script>
(function () {
  const TOKEN_KEY = "venta_bots_portal_access_token";
  const IDENTITY_LABEL_KEY = "venta_bots_portal_identity_label";

  const el = (id) => document.getElementById(id);
  const tokenInput = el("access-token");
  const tokenStatus = el("token-status");

  function getToken() {
    return localStorage.getItem(TOKEN_KEY) || "";
  }

  function setStatus(node, message, kind) {
    node.textContent = message || "";
    node.className = "status" + (kind ? " " + kind : "");
  }

  // Best-effort read of the "email" claim out of the JWT payload, purely to show
  // "Logged in as ..." - never trust this for anything security-relevant.
  function decodeEmailClaim(jwt) {
    try {
      const payload = JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
      return payload.email || payload.sub || null;
    } catch {
      return null;
    }
  }

  function refreshLoginUi() {
    const token = getToken();
    const label = localStorage.getItem(IDENTITY_LABEL_KEY);
    el("login-form").style.display = token ? "none" : "block";
    el("logged-in-state").style.display = token ? "block" : "none";
    if (token) el("logged-in-as").textContent = label || "your venta.gg account";
  }

  function setSession(token, label) {
    localStorage.setItem(TOKEN_KEY, token);
    if (label) localStorage.setItem(IDENTITY_LABEL_KEY, label);
    else localStorage.removeItem(IDENTITY_LABEL_KEY);
    refreshLoginUi();
  }

  function clearSession() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(IDENTITY_LABEL_KEY);
    tokenInput.value = "";
    refreshLoginUi();
    el("bot-list").innerHTML = "";
  }

  el("login-submit").addEventListener("click", async () => {
    const username = el("login-username").value.trim();
    const password = el("login-password").value;
    if (!username || !password) {
      setStatus(tokenStatus, "Enter your email/username and password.", "error");
      return;
    }

    setStatus(tokenStatus, "Logging in...", "");
    try {
      const response = await fetch("/connect/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "password",
          username,
          password,
          client_id: "echo",
        }),
      });

      const text = await response.text();
      let body = null;
      try { body = text ? JSON.parse(text) : null; } catch { body = text; }

      if (!response.ok || !body || !body.access_token) {
        const message = (body && (body.error_description || body.error)) ||
          (typeof body === "string" && body) || "Login failed - check your credentials.";
        throw new Error(message);
      }

      el("login-password").value = "";
      setSession(body.access_token, decodeEmailClaim(body.access_token) || username);
      setStatus(tokenStatus, "Logged in.", "ok");
      loadBots();
    } catch (err) {
      setStatus(tokenStatus, err.message, "error");
    }
  });

  el("login-password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") el("login-submit").click();
  });

  el("logout").addEventListener("click", () => {
    clearSession();
    setStatus(tokenStatus, "Logged out.", "");
  });

  el("save-token").addEventListener("click", () => {
    const token = tokenInput.value.trim();
    if (!token) return;
    setSession(token, decodeEmailClaim(token));
    setStatus(tokenStatus, "Token saved.", "ok");
    loadBots();
  });

  refreshLoginUi();

  async function api(path, options) {
    const token = getToken();
    if (!token) throw new Error("Log in above first.");

    const response = await fetch(path, {
      ...options,
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json",
        ...(options && options.headers),
      },
    });

    if (response.status === 204) return null;

    let body = null;
    const text = await response.text();
    if (text) {
      try { body = JSON.parse(text); } catch { body = text; }
    }

    if (!response.ok) {
      const message = (body && body.title) || (typeof body === "string" ? body : null) || response.statusText;
      throw new Error(`${response.status}: ${message}`);
    }

    return body;
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function copyButton(value) {
    const button = document.createElement("button");
    button.textContent = "Copy";
    button.addEventListener("click", async () => {
      await navigator.clipboard.writeText(value);
      button.textContent = "Copied";
      setTimeout(() => (button.textContent = "Copy"), 1200);
    });
    return button;
  }

  function credentialRow(label, value) {
    const wrap = document.createElement("div");
    wrap.className = "credential";
    const labelEl = document.createElement("label");
    labelEl.textContent = label;
    const row = document.createElement("div");
    row.className = "mono";
    const span = document.createElement("span");
    span.textContent = value;
    row.appendChild(span);
    row.appendChild(copyButton(value));
    wrap.appendChild(labelEl);
    wrap.appendChild(row);
    return wrap;
  }

  // ── Permission picker ────────────────────────────────────────────────────
  // Bit positions mirror Guild.Domain.Enums.Permissions exactly. Superadmin (bit 63) is
  // deliberately excluded - it's a guild-owner-only catch-all that would just get clamped
  // away for any non-owner installer, so offering it here would only be confusing.

  const PERMISSION_GROUPS = [
    { label: "Channel", items: [["ViewChannel", 0]] },
    { label: "Messages", items: [
      ["SendMessages", 1], ["EditOwnMessages", 2], ["EditAnyMessage", 3],
      ["DeleteOwnMessages", 4], ["DeleteAnyMessage", 5], ["PinMessages", 6],
      ["AttachFiles", 7], ["EmbedLinks", 8], ["AddReactions", 9],
    ] },
    { label: "Voice", items: [
      ["Connect", 10], ["Speak", 11], ["Stream", 12],
      ["MuteMembers", 13], ["DeafenMembers", 14], ["MoveMembers", 15],
    ] },
    { label: "Threads", items: [
      ["CreateThreads", 16], ["SendMessagesInThreads", 17],
      ["ManageOwnThreads", 18], ["ManageAnyThread", 19],
    ] },
    { label: "Channel management", items: [
      ["ManageChannel", 20], ["ManagePermissions", 21], ["CreateInvite", 22],
    ] },
    { label: "Wiki", items: [
      ["ViewWiki", 23], ["CreateWikiPages", 24], ["EditOwnWikiPages", 25],
      ["EditAnyWikiPage", 26], ["DeleteWikiPages", 27], ["ManageWikiRevisions", 28],
      ["ManageWikiStructure", 29], ["ModerateWikiComments", 30], ["PublishWikiPublicly", 31],
    ] },
    { label: "Guild moderation", items: [
      ["KickMembers", 32], ["BanMembers", 33], ["ModerateMembers", 34],
      ["ManageGuild", 35], ["ViewAuditLog", 36],
    ] },
  ];

  // Builds one picker's checkboxes into any container - reused for the create-bot form's fixed
  // #permission-picker element and for each bot's per-guild install panel (built on demand, so
  // there can be several live at once).
  function buildPermissionPickerInto(container) {
    container.innerHTML = "";

    for (const group of PERMISSION_GROUPS) {
      const groupEl = document.createElement("div");
      groupEl.className = "permission-group";
      const heading = document.createElement("h3");
      heading.textContent = group.label;
      groupEl.appendChild(heading);

      for (const [name, bit] of group.items) {
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.dataset.bit = String(2 ** bit);
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(name));
        groupEl.appendChild(label);
      }

      container.appendChild(groupEl);
    }
  }

  function computePermissionsIn(container) {
    return Array.from(container.querySelectorAll("input:checked"))
      .reduce((sum, cb) => sum + Number(cb.dataset.bit), 0);
  }

  function renderPermissionPicker() {
    const container = el("permission-picker");
    buildPermissionPickerInto(container);
    container.querySelectorAll("input").forEach((cb) => cb.addEventListener("change", updateComputedPermissions));
    updateComputedPermissions();
  }

  function computeSelectedPermissions() {
    return computePermissionsIn(el("permission-picker"));
  }

  function updateComputedPermissions() {
    el("permissions-computed").textContent = `Computed bitmask: ${computeSelectedPermissions()}`;
  }

  renderPermissionPicker();

  // ── Create bot ──────────────────────────────────────────────────────────

  el("create-bot").addEventListener("click", async () => {
    const status = el("create-status");
    const credentialsBox = el("new-credentials");
    credentialsBox.innerHTML = "";
    setStatus(status, "Creating...", "");

    const name = el("bot-name").value.trim();
    if (!name) { setStatus(status, "Name is required.", "error"); return; }

    try {
      const created = await api("/api/v1/bots/applications", {
        method: "POST",
        body: JSON.stringify({
          name,
          description: el("bot-description").value.trim() || null,
          iconUrl: el("bot-icon").value.trim() || null,
          defaultPermissions: computeSelectedPermissions(),
        }),
      });

      setStatus(status, "Bot created. Copy the credentials now — the secret is never shown again.", "ok");
      credentialsBox.appendChild(credentialRow("Client ID", created.clientId));
      credentialsBox.appendChild(credentialRow("Client secret", created.clientSecret));
      credentialsBox.appendChild(credentialRow("Discord-compat token (Authorization: Bot <token>)", created.compatToken));
      const warn = document.createElement("p");
      warn.className = "warning";
      warn.textContent = "This is the only time the secret and compat token are shown. If you lose them, use \"Reset secret\" below.";
      credentialsBox.appendChild(warn);

      el("bot-name").value = "";
      el("bot-description").value = "";
      el("bot-icon").value = "";
      document.querySelectorAll("#permission-picker input:checked").forEach((cb) => (cb.checked = false));
      updateComputedPermissions();

      loadBots();
    } catch (err) {
      setStatus(status, err.message, "error");
    }
  });

  // ── List / manage bots ──────────────────────────────────────────────────

  async function loadBots() {
    const status = el("list-status");
    const list = el("bot-list");
    setStatus(status, "Loading...", "");

    try {
      const bots = await api("/api/v1/bots/applications");
      list.innerHTML = "";

      if (!bots || bots.length === 0) {
        list.innerHTML = '<p class="empty">No bots yet — create one above.</p>';
        setStatus(status, "", "");
        return;
      }

      for (const bot of bots) {
        list.appendChild(renderBotItem(bot));
      }
      setStatus(status, "", "");
    } catch (err) {
      setStatus(status, err.message, "error");
    }
  }

  function renderBotItem(bot) {
    const item = document.createElement("div");
    item.className = "bot-item";

    const top = document.createElement("div");
    top.className = "top";
    top.innerHTML = `
      <div>
        <div class="name">${escapeHtml(bot.name)}</div>
        <div class="id">${escapeHtml(bot.botUserId)}</div>
      </div>
      <span class="badge ${bot.isEnabled ? "enabled" : "disabled"}">${bot.isEnabled ? "Enabled" : "Disabled"}</span>
    `;
    item.appendChild(top);

    const actions = document.createElement("div");
    actions.className = "actions";

    const resetButton = document.createElement("button");
    resetButton.textContent = "Reset secret";
    resetButton.addEventListener("click", () => resetSecret(bot.id, item));
    actions.appendChild(resetButton);

    const disableButton = document.createElement("button");
    disableButton.className = "danger";
    disableButton.textContent = "Disable";
    disableButton.disabled = !bot.isEnabled;
    disableButton.addEventListener("click", () => disableBot(bot.id, item));
    actions.appendChild(disableButton);

    const guildsButton = document.createElement("button");
    guildsButton.textContent = "Guilds";
    actions.appendChild(guildsButton);

    item.appendChild(actions);

    const resultBox = document.createElement("div");
    resultBox.className = "reset-result";
    item.appendChild(resultBox);

    const installPanel = document.createElement("div");
    installPanel.className = "install-panel";
    installPanel.style.display = "none";
    item.appendChild(installPanel);

    let installPanelBuilt = false;
    guildsButton.addEventListener("click", () => {
      const opening = installPanel.style.display === "none";
      installPanel.style.display = opening ? "block" : "none";
      if (opening && !installPanelBuilt) {
        renderInstallPanel(bot, installPanel);
        installPanelBuilt = true;
      }
    });

    return item;
  }

  // ── Install bot into a guild ─────────────────────────────────────────────
  // Mirrors Discord's own OAuth2 "add to server" flow (POST /api/v1/oauth2/authorize) - the
  // requested permission bitmask gets clamped server-side to what the installer can actually
  // grant, so GrantedPermissions in the response may be lower than what was checked here.

  function renderInstallPanel(bot, panel) {
    panel.innerHTML = "";

    const installedHeading = document.createElement("p");
    installedHeading.className = "subheading";
    installedHeading.textContent = "Installed guilds";
    panel.appendChild(installedHeading);

    const installedList = document.createElement("div");
    panel.appendChild(installedList);

    const installedStatus = document.createElement("p");
    installedStatus.className = "status";
    panel.appendChild(installedStatus);

    async function loadInstallations() {
      installedList.innerHTML = "";
      setStatus(installedStatus, "Loading...", "");
      try {
        const installations = await api(`/api/v1/applications/${bot.id}/installations`);
        if (!installations || installations.length === 0) {
          installedList.innerHTML = '<p class="empty">Not installed anywhere yet.</p>';
        } else {
          for (const install of installations) {
            installedList.appendChild(renderInstallationRow(bot, install, loadInstallations));
          }
        }
        setStatus(installedStatus, "", "");
      } catch (err) {
        setStatus(installedStatus, err.message, "error");
      }
    }

    const formHeading = document.createElement("p");
    formHeading.className = "subheading";
    formHeading.textContent = "Install into a guild";
    panel.appendChild(formHeading);

    const guildIdLabel = document.createElement("label");
    guildIdLabel.textContent = "Guild ID (you need Manage Guild there)";
    panel.appendChild(guildIdLabel);
    const guildIdInput = document.createElement("input");
    guildIdInput.type = "text";
    guildIdInput.placeholder = "gild_...";
    panel.appendChild(guildIdInput);

    const permissionsLabel = document.createElement("label");
    permissionsLabel.textContent = "Permissions to request";
    panel.appendChild(permissionsLabel);

    const pickerContainer = document.createElement("div");
    pickerContainer.className = "permission-picker";
    panel.appendChild(pickerContainer);
    buildPermissionPickerInto(pickerContainer);

    const computedLine = document.createElement("p");
    computedLine.className = "computed-value";
    computedLine.textContent = "Requesting bitmask: 0";
    panel.appendChild(computedLine);
    pickerContainer.querySelectorAll("input").forEach((cb) =>
      cb.addEventListener("change", () => {
        computedLine.textContent = `Requesting bitmask: ${computePermissionsIn(pickerContainer)}`;
      })
    );

    const installActions = document.createElement("div");
    installActions.className = "actions";
    const installButton = document.createElement("button");
    installButton.className = "primary";
    installButton.textContent = "Install";
    installActions.appendChild(installButton);
    panel.appendChild(installActions);

    const installStatus = document.createElement("p");
    installStatus.className = "status";
    panel.appendChild(installStatus);

    installButton.addEventListener("click", async () => {
      const guildId = guildIdInput.value.trim();
      if (!guildId) {
        setStatus(installStatus, "Guild ID is required.", "error");
        return;
      }

      setStatus(installStatus, "Installing...", "");
      try {
        const result = await api("/api/v1/oauth2/authorize", {
          method: "POST",
          body: JSON.stringify({
            clientId: bot.botUserId,
            guildId,
            permissions: computePermissionsIn(pickerContainer),
          }),
        });
        setStatus(installStatus, `Installed. Granted permissions bitmask: ${result.grantedPermissions}`, "ok");
        guildIdInput.value = "";
        pickerContainer.querySelectorAll("input:checked").forEach((cb) => (cb.checked = false));
        computedLine.textContent = "Requesting bitmask: 0";
        loadInstallations();
      } catch (err) {
        setStatus(installStatus, err.message, "error");
      }
    });

    loadInstallations();
  }

  function renderInstallationRow(bot, install, onChange) {
    const wrap = document.createElement("div");

    const row = document.createElement("div");
    row.className = "install-row";
    row.innerHTML = `
      <div>
        <div class="guild-id">${escapeHtml(install.guildId)}</div>
        <div class="perms">permissions: ${install.grantedPermissions}</div>
      </div>
    `;

    const uninstallButton = document.createElement("button");
    uninstallButton.className = "danger";
    uninstallButton.textContent = "Uninstall";
    row.appendChild(uninstallButton);
    wrap.appendChild(row);

    const errorLine = document.createElement("p");
    errorLine.className = "status error";
    errorLine.style.display = "none";
    wrap.appendChild(errorLine);

    uninstallButton.addEventListener("click", async () => {
      if (!confirm(`Remove this bot from guild ${install.guildId}?`)) return;
      try {
        await api(`/api/v1/applications/${bot.id}/installations/${install.guildId}`, { method: "DELETE" });
        onChange();
      } catch (err) {
        errorLine.textContent = err.message;
        errorLine.style.display = "block";
      }
    });

    return wrap;
  }

  async function resetSecret(applicationId, item) {
    const resultBox = item.querySelector(".reset-result");
    resultBox.innerHTML = "";
    try {
      const reset = await api(`/api/v1/bots/applications/${applicationId}/reset-secret`, { method: "POST" });
      resultBox.appendChild(credentialRow("New client secret", reset.clientSecret));
      resultBox.appendChild(credentialRow("New Discord-compat token", reset.compatToken));
    } catch (err) {
      const p = document.createElement("p");
      p.className = "status error";
      p.textContent = err.message;
      resultBox.appendChild(p);
    }
  }

  async function disableBot(applicationId, item) {
    if (!confirm("Disable this bot? It will no longer be able to authenticate.")) return;
    try {
      await api(`/api/v1/bots/applications/${applicationId}`, { method: "DELETE" });
      loadBots();
    } catch (err) {
      const p = document.createElement("p");
      p.className = "status error";
      p.textContent = err.message;
      item.appendChild(p);
    }
  }

  el("refresh-bots").addEventListener("click", loadBots);

  if (getToken()) loadBots();
})();
</script>
</body>
</html>
