name: Build & Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore
      - name: Write Secrets
        env:
          SIX_LABORS_LIC: ${{ secrets.SIX_LABORS_LIC }}
        run: |

          echo "$SIX_LABORS_LIC" > ./Messaging.Application/Credentials/sixlabors.lic

      - name: Build
        run: dotnet build --configuration Release --no-restore
        

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      
      - name: Run Tests with Coverage
        run: dotnet-coverage collect "dotnet test" -f cobertura -o solution_coverage.xml
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: solution_coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          output: both
            
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
      - name: Generate Coverage Badge Image
        uses: cicirello/jacoco-badge-generator@v2
        with:
                    # Pass your cobertura xml file here
          coverage-reports: solution_coverage.xml
          badges-directory: .github/badges
          generate-coverage-badge: true
          coverage-label: 'coverage'
            
      - name: Commit Badge Image
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .github/badges/coverage.svg
        git commit -m "Update coverage badge [skip ci]" || exit 0
        git push
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - project: echo
            context: .
            dockerfile: Echo/Dockerfile
            image: echo
          - project: guild
            context: .
            dockerfile: Guild.Application/Dockerfile
            image: guild-application
          - project: messaging
            context: .
            dockerfile: Messaging.Application/Dockerfile
            image: messaging-application
          - project: identity
            context: .
            dockerfile: Identity.Application/Dockerfile
            image: identity-application
          - project: social
            context: .
            dockerfile: Social.Application/Dockerfile
            image: social-application      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Write Secrets
        env:
          SIX_LABORS_LIC: ${{ secrets.SIX_LABORS_LIC }}
        run: |
          echo "$SIX_LABORS_LIC" > ./Messaging.Application/Credentials/sixlabors.lic
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        env:
          IDENTITY_KEY_PASSWORD: ${{ secrets.IDENTITY_KEY_PASSWORD }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # These two lines are critical for speed on repeat builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IDENTITY_KEY_PASSWORD=${{ secrets.IDENTITY_KEY_PASSWORD }}
