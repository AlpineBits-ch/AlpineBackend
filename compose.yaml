# =====================================================================================
#  Local development stack. NOT the self-hosting deployment.
#
#  For an actual installation use deploy/install.sh (Linux) or
#  deploy/Install-VentaStack.ps1 (Windows), which drive deploy/compose.yaml. That file
#  covers all nine services (this one predates bots/import/isle), bootstraps the
#  databases on external servers too, terminates TLS, and boots on host start.
# =====================================================================================

# Shared environment for all application services
x-app-env: &app-env
  DATABASE_HOSTNAME: postgres
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: admin
  RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: Production
  AUTH_REQUIRE_USER_EMAIL_VERIFICATION: "false"
  
  # Configuration parameters set via installer
  INSTANCE_NAME: "${INSTANCE_NAME}"
  INSTANCE_URL: "${INSTANCE_URL}"
  PUBLIC_URL: "${STORAGE_PUBLIC_URL}"
  IDENTITY_KEY_PASSWORD: "${IDENTITY_KEY_PASSWORD}"
  FEDERATION_PRIVATE_KEY_BASE_64: "${FEDERATION_PRIVATE_KEY_BASE_64}"
  FEDERATION_PUBLIC_KEY_BASE_64: "${FEDERATION_PUBLIC_KEY_BASE_64}"

  # Self-host: every entitlement resolves to its maximum and no billing surface is shown. The
  # default everywhere, stated here rather than left implicit so it is obvious there is a knob and
  # that nothing has to be done about it. Nothing validates this - there is no license check.
  #
  # Set LICENSE_MODE=hosted and BILLING_SERVICE_URL=http://billing:8080 together with
  # `--profile hosted` to bring the billing service up locally. All three, or none: hosted with
  # nothing configured refuses to start (deliberately, see AppEnvironment.LicenseConfiguration), and
  # the billing service refuses to start in selfhost, where nothing would route to it.
  LICENSE_MODE: "${LICENSE_MODE:-selfhost}"
  # Raised to the top of the ladder so a Pro guild actually receives the 4K its plan grants - see
  # deploy/compose.yaml for the full note, including the egress this costs while publishers are
  # still sending a single encoding. Pinned to the rung rather than left empty so that extending the
  # ladder above 2160p60 later is a deliberate edit here and not an automatic raise.
  VOICE_VIDEO_CEILING: "${VOICE_VIDEO_CEILING:-2160p60}"
  BILLING_SERVICE_URL: "${BILLING_SERVICE_URL:-}"

  BUCKET_NAME: "echo-chat"
  ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
  SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
  SERVICE_URL: "http://minio:9000"
  USE_SERVICE_URL: "true"
  REGION: "us-east-1"

services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: database_service
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_MULTIPLE_DATABASES: identity_db,guild_db,messaging_db,social_db,echo_db,federation_db,billing_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_service
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_service
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  scylladb:
    image: scylladb/scylla:6.2
    container_name: scylla_service
    command: --authenticator=PasswordAuthenticator --authorizer=CassandraAuthorizer --smp=1
    ports:
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'DESCRIBE KEYSPACES' 2>/dev/null && echo OK || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio_service
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio_init_service
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 \"${MINIO_ROOT_USER}\" \"${MINIO_ROOT_PASSWORD}\";
      /usr/bin/mc mb --ignore-existing localminio/echo-chat;
      /usr/bin/mc anonymous set public localminio/echo-chat;
      exit 0;
      "

  # ── Application Services ──────────────────────────────────────────────────────

  identity:
    build:
      context: .
      dockerfile: Identity.Application/Dockerfile
    container_name: identity_service
    environment:
      <<: *app-env
      DATABASE_NAME: identity_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/identity/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  guild:
    build:
      context: .
      dockerfile: Guild.Application/Dockerfile
    container_name: guild_service
    environment:
      <<: *app-env
      DATABASE_NAME: guild_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/guild/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  messaging:
    build:
      context: .
      dockerfile: Messaging.Application/Dockerfile
    container_name: messaging_service
    environment:
      <<: *app-env
      DATABASE_NAME: messaging_db
      USE_SCYLLA_DB: "true"
      SCYLLA_HOST: scylladb
      SCYLLA_PORT: "9042"
      SCYLLA_USERNAME: cassandra
      SCYLLA_PASSWORD: "${SCYLLA_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      scylladb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/messaging/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped

  social:
    build:
      context: .
      dockerfile: Social.Application/Dockerfile
    container_name: social_service
    environment:
      <<: *app-env
      DATABASE_NAME: social_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/social/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  federation:
    build:
      context: .
      dockerfile: Federation.Application/Dockerfile
    container_name: federation_service
    environment:
      <<: *app-env
      DATABASE_NAME: federation_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/federation/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  # Subscriptions, grants and the Stripe key (docs/specs/monetization.md). Behind the `hosted`
  # profile and therefore NOT started by a plain `docker compose up`: in selfhost every entitlement
  # already resolves to its maximum, no billing surface is shown, and this service would have nothing
  # to answer. Nothing else depends on it, so the rest of the stack is healthy without it.
  billing:
    profiles: ["hosted"]
    build:
      context: .
      dockerfile: Billing.Application/Dockerfile
    container_name: billing_service
    environment:
      <<: *app-env
      DATABASE_NAME: billing_db
      # The one place a Stripe key ever lives. Deliberately not in x-app-env, for the same reason
      # GATEWAY_PROXY_SECRET is not: putting it there would hand it to all six other services.
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/billing/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  echo:
    build:
      context: .
      dockerfile: Echo/Dockerfile
    container_name: echo
    environment:
      <<: *app-env
      DATABASE_NAME: echo_db
      Services__Identity: http://identity:8080
      Services__Guild: http://guild:8080
      Services__Messaging: http://messaging:8080
      Services__Social: http://social:8080
      Services__Federation: http://federation:8080
    ports:
      - "8080:8080"
    depends_on:
      identity:
        condition: service_started
      guild:
        condition: service_started
      messaging:
        condition: service_started
      social:
        condition: service_started
      federation:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/redis
  rabbitmq_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/rabbitmq
  scylla_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/scylla
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/minio