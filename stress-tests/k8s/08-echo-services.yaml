# ── Echo YARP Proxy config ───────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-proxy-config
  namespace: echo-stress
data:
  Services__Identity: "http://_http.identity.echo-stress.svc.cluster.local"
  Services__Guild: "http://_http.guild.echo-stress.svc.cluster.local"
  Services__Messaging: "http://_http.messaging.echo-stress.svc.cluster.local"
  Services__Social: "http://_http.social.echo-stress.svc.cluster.local"
---
# ── Echo YARP Proxy ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-proxy
  namespace: echo-stress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-proxy
  template:
    metadata:
      labels:
        app: echo-proxy
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: echo-proxy
          image: ghcr.io/alpinebits-ch/echo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: echo-proxy-config
          env:
            - name: DATABASE_HOSTNAME
              value: pgbouncer
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: echo_db
            - name: DATABASE_USERNAME
              value: postgres
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: echo-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: echo-secrets
                  key: REDIS_PASSWORD
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: echo-secrets
                  key: AUTH_KEY
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: RABBITMQ_HOST
              value: echo-rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              value: admin
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: echo-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "4"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: echo-proxy
  namespace: echo-stress
spec:
  selector:
    app: echo-proxy
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
